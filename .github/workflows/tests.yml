name: Tests

on:
  push:
  pull_request:

jobs:
  android-unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install npm dependencies
        run: npm ci

      - name: Run the Android test suite
        working-directory: tests/android
        run: ./gradlew test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            tests/android/build/reports/tests/
            tests/android/build/test-results/
